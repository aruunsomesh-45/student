<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completing Sign In... | MindConnect</title>
    <style>
        body {
            background: #0f0f1a;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .loading-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            max-width: 400px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-card">
        <div class="spinner"></div>
        <h2>Signing you in...</h2>
        <p style="color: #94a3b8; font-size: 0.9rem;">Connecting to your account via Supabase Auth...</p>
    </div>

    <script>
        (function() {
            // Parse tokens from hash fragment (#access_token=...) or query string (?code=...)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash || window.location.search);
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            const code = params.get('code');

            if (accessToken) {
                // Submit access token to server callback via POST
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = "{% url 'accounts:supabase_callback' %}";

                const csrfInput = document.createElement('input');
                csrfInput.type = 'hidden';
                csrfInput.name = 'csrfmiddlewaretoken';
                csrfInput.value = "{{ csrf_token }}";
                form.appendChild(csrfInput);

                const tokenInput = document.createElement('input');
                tokenInput.type = 'hidden';
                tokenInput.name = 'access_token';
                tokenInput.value = accessToken;
                form.appendChild(tokenInput);

                document.body.appendChild(form);
                form.submit();
            } else if (!code) {
                // If neither token nor code found, redirect to login
                window.location.href = "{% url 'accounts:login' %}";
            }
        })();
    </script>
</body>
</html>
